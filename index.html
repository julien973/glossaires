    dupMap = {};
    data.chapters.forEach(function (ch) {
      ch.terms.concat(ch.characters).forEach(function (e) { dupMap[e.raw] = (dupMap[e.raw] || 0) + 1; });
    });
  }
  function dupRawCount() { var n = 0; for (var k in dupMap) if (dupMap[k] > 1) n++; return n; }

  // ── Copie ──
  // Copie intelligente : retire l'éventuelle parenthèse d'annotation en fin de raw
  // (« 头狼 (à ajouter à la main) » → copie « 头狼 »). L'affichage reste inchangé.
  function stripCopy(s) { return (s || "").replace(/\s*\([^)]*\)\s*$/, ""); }

  function copyText(t, btn) {
    function done() {
      if (btn) { var old = btn.textContent; btn.textContent = "✓"; setTimeout(function () { btn.textContent = old; }, 900); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done, function () { fallback(t); done(); });
    } else { fallback(t); done(); }
    function fallback(txt) {
      var ta = document.createElement("textarea");
      ta.value = txt; ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (_) {}
      document.body.removeChild(ta);
    }
  }
  function cpyBtn(title, getText) {
    var b = el("button", "cpy", "📋");
    b.type = "button"; b.title = title;
    b.addEventListener("click", function (ev) { ev.stopPropagation(); copyText(getText(), b); });
    return b;
  }

  // ── Badges ──
  function verdictBadge(v) {
    var m = { corriger: ["v-corriger", "⚠ Corriger"], harmoniser: ["v-harmoniser", "↻ Harmoniser"], garder: ["v-garder", "✓ Garder"] };
    var conf = m[v] || m.garder;
    return el("span", "badge " + conf[0], conf[1]);
  }
  function metaItem(label, val) {
    var s = el("span", "m-it");
    s.appendChild(el("b", null, label + " : "));
    s.appendChild(document.createTextNode(val));
    return s;
  }

  // ── Stats ──
  function computeStats(data) {
    var s = { chapters: data.chapters.length, terms: 0, chars: 0, corriger: 0, harmoniser: 0, garder: 0, corrigees: 0, fixTodo: 0, fixC: 0, fixH: 0 };
    data.chapters.forEach(function (ch) {
      s.terms += ch.terms.length;
      s.chars += ch.characters.length;
      var all = ch.terms.concat(ch.characters);
      all.forEach(function (e) {
        if (e.verdict === "corriger") s.corriger++;
        else if (e.verdict === "harmoniser") s.harmoniser++;
        else s.garder++;
      });
      if (ch.corrige) { s.corrigees += all.length; }
      else {
        all.forEach(function (e) {
          if (e.verdict === "corriger") { s.fixTodo++; s.fixC++; }
          else if (e.verdict === "harmoniser") { s.fixTodo++; s.fixH++; }
        });
      }
    });
    s.total = s.terms + s.chars;
    return s;
  }

  // ── Tableau d'un chapitre (termes ou personnages) ──
  var expanders = []; // callbacks d'ouverture des lignes de détails de ce rendu
  var chapterTogglers = []; // contrôleurs de repli des chapitres de ce rendu

  function tableNode(items, isChar, label, st, done) {
    var onlyFix = st.onlyFix;
    var list = items.filter(function (e) { return !onlyFix || e.verdict !== "garder"; });
    var wrap = el("div");
    wrap.appendChild(el("div", "tbl-title", label + " (" + list.length + (onlyFix && list.length !== items.length ? "/" + items.length : "") + ")"));
    if (!list.length) { wrap.appendChild(el("div", "sub", "— aucun —")); return wrap; }
    var cols = isChar
      ? [{ k: "raw", l: "Raw" }, { k: "tr", l: "Traduction" }, { k: "gender", l: "Genre" }, { k: "note", l: "Note (0-100)" }, { k: "verdict", l: "Verdict" }]
      : [{ k: "raw", l: "Raw" }, { k: "tr", l: "Traduction" }, { k: "cat", l: "Catégorie" }, { k: "note", l: "Note (0-100)" }, { k: "verdict", l: "Verdict" }];
    var table = el("table", "gtab");
    var thead = el("thead");
    var hr = el("tr");
    hr.appendChild(el("th", "td-x", ""));
    cols.forEach(function (c) {
      var th = el("th", null, c.l);
      if (c.k === "raw" || c.k === "tr" || c.k === "note") {
        var b = el("button", "cpy colcpy", "⧉");
        b.type = "button"; b.title = "Copier toute la colonne";
        (function (key) {
          b.addEventListener("click", function (ev) {
            ev.stopPropagation();
            copyText(list.map(function (e) { return key === "raw" ? stripCopy(e[key]) : (e[key] || ""); }).join("\n"), b);
          });
        })(c.k);
        th.appendChild(b);
      }
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);
    var tbody = el("tbody");
    list.forEach(function (e, i) {
      // ligne principale
      var tr = el("tr", "grow" + (i % 2 ? " alt" : "") + (done ? " done" : ""));
      tr.appendChild(el("td", "td-x", "▸"));
      var tdR = el("td", "td-raw", e.raw);
      tdR.appendChild(cpyBtn("Copier le raw (sans la parenthèse)", function () { return stripCopy(e.raw); }));
      if (dupMap[e.raw] > 1) {
        var db = el("span", "badge dup", "⧉ ×" + dupMap[e.raw]);
        db.title = "Doublon : ce terme apparaît " + dupMap[e.raw] + " fois dans le roman — vérifie que les traductions sont harmonisées.";
        tdR.appendChild(db);
      }
      tr.appendChild(tdR);
      var tdT = el("td", "td-tr", e.tr);
      tdT.appendChild(cpyBtn("Copier la traduction", function () { return e.tr; }));
      tr.appendChild(tdT);
      var tdC = el("td");
      if (!isChar) { if (e.cat) tdC.appendChild(el("span", "badge cat", e.cat)); }
      else tdC.appendChild(el("span", "badge gd", e.gender || "—"));
      tr.appendChild(tdC);
      var len = (e.note || "").length;
      var tdN = el("td", "td-note", e.note || "");
      tdN.appendChild(el("span", "cnt" + (len > 100 ? " over" : ""), len + "/100"));
      tdN.appendChild(cpyBtn("Copier la note", function () { return e.note || ""; }));
      tr.appendChild(tdN);
      var tdV = el("td");
      tdV.appendChild(verdictBadge(e.verdict));
      if (e.manual) { var manB = el("span", "badge man", "✋"); manB.title = "À ajouter à la main dans l'appli (le bouton ⧉ ne copie que le raw, sans annotation)"; tdV.appendChild(manB); }
      tr.appendChild(tdV);
      // ligne de détails (dépliable)
      var dtr = el("tr", "det-row");
      dtr.style.display = "none";
      var tdD = el("td", "td-det");
      tdD.colSpan = cols.length + 1;
      if (e.detail) tdD.appendChild(el("div", "e-detail", e.detail));
      var meta = el("div", "e-meta");
      if (!isChar && e.auto) meta.appendChild(metaItem("🤖 Applito", e.auto));
      if (!isChar) {
        if (e.canon) meta.appendChild(metaItem("✅ Canon EN", e.canon));
        if (e.canonFR) meta.appendChild(metaItem("🇫🇷 Canon FR", e.canonFR));
      } else {
        if (e.gender) meta.appendChild(metaItem("Genre", e.gender));
      }
      if (meta.children.length) tdD.appendChild(meta);
      if (e.action) tdD.appendChild(el("div", "e-action", "🛠️ " + e.action));
      dtr.appendChild(tdD);
      // dépliage
      var open = false;
      function setOpen(v) {
        open = v;
        dtr.style.display = v ? "table-row" : "none";
        tr.children[0].textContent = v ? "▾" : "▸";
      }
      tr.addEventListener("click", function () { setOpen(!open); });
      expanders.push(setOpen);
      tbody.appendChild(tr);
      tbody.appendChild(dtr);
    });
    table.appendChild(tbody);
    var tw = el("div", "twrap");
    tw.appendChild(table);
    wrap.appendChild(tw);
    return wrap;
  }

  // ── Chapitre ──
  function chapterNode(ch, st) {
    if (st.hideDone && ch.corrige) return null;
    var onlyFix = st.onlyFix;
    var keep = function (e) { return !onlyFix || e.verdict !== "garder"; };
    var terms = ch.terms.filter(keep);
    var chars = ch.characters.filter(keep);
    if (!terms.length && !chars.length) return null;
    var nfix = 0;
    ch.terms.concat(ch.characters).forEach(function (e) { if (e.verdict !== "garder") nfix++; });
    var card = el("section", "chapter");
    card.id = ch.id;
    var head = el("div", "ch-head");
    head.title = "Cliquer pour déplier / replier ce chapitre";
    var chev = el("span", "ch-chev", st.open[ch.id] ? "▾" : "▸");
    head.appendChild(chev);
    head.appendChild(el("h2", "ch-title", ch.title));
    head.appendChild(el("span", "cnt", (ch.terms.length + ch.characters.length) + " fiches"));
    if (ch.corrige) head.appendChild(el("span", "badge v-garder", "✔ Corrigé"));
    else if (nfix) head.appendChild(el("span", "badge fixc", "⚠ " + nfix + " à corriger"));
    head.appendChild(el("div", "ch-cap", "📸 " + ch.capture));
    card.appendChild(head);
    var body = el("div", "ch-body");
    if (ch.observations && ch.observations.length) {
      var d = el("details", "ch-obs");
      d.appendChild(el("summary", null, "👁️ Observations (" + ch.observations.length + ")"));
      var box = el("div", "obs-box");
      var ul = el("ul", "obs");
      ch.observations.forEach(function (o) { ul.appendChild(el("li", null, o)); });
      box.appendChild(ul);
      d.appendChild(box);
      body.appendChild(d);
    }
    body.appendChild(tableNode(ch.terms, false, "Termes", st, !!ch.corrige));
    body.appendChild(tableNode(ch.characters, true, "Personnages", st, !!ch.corrige));
    if (ch.sources && ch.sources.length) {
      var sTitle = el("div", "tbl-title", "Sources");
      body.appendChild(sTitle);
      var sr = el("div", "srcs");
      ch.sources.forEach(function (s) {
        var a = el("a", null, s.label);
        a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
        sr.appendChild(a);
      });
      body.appendChild(sr);
    }
    card.appendChild(body);
    function setOpen(v) {
      body.style.display = v ? "" : "none";
      chev.textContent = v ? "▾" : "▸";
    }
    setOpen(!!st.open[ch.id]);
    head.addEventListener("click", function () {
      var nv = !st.open[ch.id];
      if (nv) st.open[ch.id] = 1; else delete st.open[ch.id];
      saveOpen(st.open);
      setOpen(nv);
    });
    chapterTogglers.push({ id: ch.id, setOpen: setOpen });
    return card;
  }

  // ── Rendu complet d'un roman ──
  function renderAll(data, roman, st) {
    expanders = [];
    chapterTogglers = [];
    curData = data; curRoman = roman;
    buildDupMap(data);
    var s = computeStats(data);
    document.title = "Glossaires — " + data.identification.titre;
    try { document.documentElement.style.setProperty("--rom", roman.accent || "#2de2e6"); } catch (_) {}
    // hero
    var hero = clear($("hero"));
    hero.appendChild(el("h1", null, "🌃 " + data.identification.titre));
    hero.appendChild(el("p", "sub", roman.sub || ""));
    // Bouton de téléchargement du CSV corrigé (import appli) — visible seulement si le roman en a un.
    if (roman.csv) {
      var aCsv = document.createElement("a");
      aCsv.className = "csvbtn";
      aCsv.href = roman.csv;
      aCsv.setAttribute("download", roman.csv);
      aCsv.setAttribute("title", "Télécharger le glossaire corrigé, prêt pour l'import dans l'appli de lecture");
      aCsv.textContent = "⬇ Télécharger le CSV corrigé (import appli)";
      hero.appendChild(aCsv);
    }
    // KPI
    var kpis = clear($("kpis"));
    function kpi(label, value, sub) {
      var k = el("div", "kpi");
      k.appendChild(el("div", "label", label));
      k.appendChild(el("div", "value", String(value)));
      if (sub) k.appendChild(el("div", "sub", sub));
      return k;
    }
    kpis.appendChild(kpi("Chapitres", s.chapters));
    kpis.appendChild(kpi("Termes", s.terms));
    kpis.appendChild(kpi("Personnages", s.chars));
    kpis.appendChild(kpi("À corriger", s.fixTodo, "⚠ " + s.fixC + " corriger · ↻ " + s.fixH + " harmoniser"));
    kpis.appendChild(kpi("✔ Corrigées", s.corrigees, "marquées par Vibe"));
    kpis.appendChild(kpi("⧉ Doublons", dupRawCount(), "termes en double"));
    // barre de progression (chapitres corrigés dans les données)
    var kb = clear($("kbar"));
    var wh = el("div", "win-head");
    wh.appendChild(el("span", "win-title", "✅ Progression du chantier"));
    wh.appendChild(el("span", "sub", s.corrigees + " / " + s.total + " fiches"));
    kb.appendChild(wh);
    kb.appendChild(el("div", "win-sub", "Chapitres marqués ✔ corrigés automatiquement à chaque « glossaire suivant » — rien à cocher. " + s.garder + " « garder » · " + (s.corriger + s.harmoniser) + " corrections livrées au total."));
    var bar = el("div", "win-bar");
    var fill = el("i");
    fill.style.width = (s.total ? Math.round(s.corrigees / s.total * 100) : 0) + "%";
    bar.appendChild(fill);
    kb.appendChild(bar);
    // contrôles
    var c = clear($("controls"));
    var bFix = el("button", st.onlyFix ? "pill on" : "pill", st.onlyFix ? "☑ Corrections seulement" : "☐ Corrections seulement");
    bFix.type = "button";
    bFix.addEventListener("click", function () { st.onlyFix = !st.onlyFix; renderAll(data, roman, st); });
    c.appendChild(bFix);
    var bChO = el("button", "pill", "📖 Tout ouvrir");
    bChO.type = "button"; bChO.title = "Déplier tous les chapitres";
    bChO.addEventListener("click", function () {
      data.chapters.forEach(function (ch) { st.open[ch.id] = 1; });
      saveOpen(st.open);
      chapterTogglers.forEach(function (t) { t.setOpen(true); });
    });
    c.appendChild(bChO);
    var bChC = el("button", "pill", "📕 Tout replier");
    bChC.type = "button"; bChC.title = "Replier tous les chapitres";
    bChC.addEventListener("click", function () {
      st.open = {};
      saveOpen(st.open);
      chapterTogglers.forEach(function (t) { t.setOpen(false); });
    });
    c.appendChild(bChC);
    var bAll = el("button", "pill", "▼ Déplier fiches");
    bAll.type = "button"; bAll.title = "Déplier le détail de toutes les fiches affichées";
    bAll.addEventListener("click", function () { expanders.forEach(function (f) { f(true); }); });
    c.appendChild(bAll);
    var bNone = el("button", "pill", "▲ Replier fiches");
    bNone.type = "button"; bNone.title = "Replier le détail de toutes les fiches";
    bNone.addEventListener("click", function () { expanders.forEach(function (f) { f(false); }); });
    c.appendChild(bNone);
    var bHide = el("button", st.hideDone ? "pill on" : "pill", st.hideDone ? "☑ Cacher les corrigées" : "☐ Cacher les corrigées");
    bHide.type = "button";
    bHide.addEventListener("click", function () { st.hideDone = !st.hideDone; renderAll(data, roman, st); });
    c.appendChild(bHide);
    // navigation chapitres
    var nav = clear($("chNav"));
    data.chapters.forEach(function (ch) {
      var a = el("a", "chpill", ch.title.split(/[—–]/)[0].trim());
      a.href = "#" + ch.id;
      a.addEventListener("click", function () {
        st.open[ch.id] = 1;
        saveOpen(st.open);
        chapterTogglers.forEach(function (t) { if (t.id === ch.id) t.setOpen(true); });
      });
      nav.appendChild(a);
    });
    // identification
    var idc = clear($("ident"));
    idc.appendChild(el("summary", null, "🔎 Identification du roman & notes de chantier"));
    var ibox = el("div", "ident-box");
    data.identification.lignes.forEach(function (l) { ibox.appendChild(el("p", null, l)); });
    idc.appendChild(ibox);
    // chapitres
    var holder = clear($("chapters"));
    data.chapters.forEach(function (ch) {
      var n = chapterNode(ch, st);
      if (n) holder.appendChild(n);
    });
    // à suivre
    var sv = clear($("suivre"));
    sv.appendChild(el("h2", null, "📌 À suivre (règles du chantier)"));
    var ul2 = el("ul");
    data.aSuivre.forEach(function (a) { ul2.appendChild(el("li", null, a)); });
    sv.appendChild(ul2);
    // botbar
    $("bbLeft").textContent = "📚 Glossaires · " + data.identification.titre;
    $("bbVer").textContent = VERSION + " · " + s.chapters + " ch. · " + s.total + " fiches";
  }

  // ── Multi-romans : registre, cache, chargement ──
  var cache = {};
  function harvestLegacy() {
    return { identification: identification, chapters: chapters, aSuivre: aSuivre };
  }
  function loadRoman(r, cb) {
    if (cache[r.id]) { cb(cache[r.id]); return; }
    var s = document.createElement("script");
    s.src = r.fichier;
    s.onload = function () {
      var data = null;
      try {
        data = r.format === "legacy" ? harvestLegacy() : (window.ROMANS_DATA || {})[r.id];
      } catch (_) { data = null; }
      if (data && data.chapters) { cache[r.id] = data; cb(data); }
      else cb(null);
    };
    s.onerror = function () { cb(null); };
    document.head.appendChild(s);
  }

  var state = { onlyFix: false, hideDone: false, open: {} };
  function buildPills(activeId) {
    var nav = clear($("tbRomans"));
    ROMANS.forEach(function (r) {
      var b = el("button", "pill" + (r.id === activeId ? " active" : ""), r.court);
      b.type = "button";
      b.addEventListener("click", function () { switchRoman(r.id); });
      nav.appendChild(b);
    });
    nav.appendChild(el("span", "pill soon", "＋ roman à venir"));
  }
  function switchRoman(id) {
    var r = null;
    for (var i = 0; i < ROMANS.length; i++) if (ROMANS[i].id === id) r = ROMANS[i];
    if (!r) r = ROMANS[0];
    buildPills(r.id);
    try { localStorage.setItem("gloss-roman", r.id); } catch (_) {}
    curRomanId = r.id;
    loadOpen(r.id);
    clear($("chapters"));
    $("loading").style.display = "";
    $("loading").textContent = "⏳ Chargement du roman…";
    loadRoman(r, function (data) {
      if (!data) {
        $("loading").style.display = "";
        $("loading").textContent = "⚠️ Impossible de charger les données de ce roman (" + r.fichier + ").";
        return;
      }
      $("loading").style.display = "none";
      state.onlyFix = false;
      state.hideDone = false;
      renderAll(data, r, state);
    });
  }

  // ── Thème nuit / jour ──
  function syncTheme() {
    var day = document.body.className.indexOf("day") >= 0;
    var b = $("btnTheme");
    if (b) b.textContent = day ? "☀️ Jour" : "🌙 Nuit";
  }
  $("btnTheme").addEventListener("click", function () {
    var day = document.body.className.indexOf("day") >= 0;
    document.body.className = day ? "night" : "day";
    try { localStorage.setItem("gloss-theme", day ? "night" : "day"); } catch (_) {}
    syncTheme();
  });

  // ── Barre de progression du scroll ──
  window.addEventListener("scroll", function () {
    var d = document.documentElement;
    var max = d.scrollHeight - d.clientHeight;
    var p = max > 0 ? (d.scrollTop / max * 100) : 0;
    var bar = $("progress");
    if (bar) bar.style.width = p + "%";
  }, { passive: true });

  // ── Boot ──
  var savedTheme = null;
  try { savedTheme = localStorage.getItem("gloss-theme"); } catch (_) {}
  document.body.className = savedTheme === "day" ? "day" : "night";
  syncTheme();
  var startId = null;
  try { startId = localStorage.getItem("gloss-roman"); } catch (_) {}
  if (typeof ROMANS === "undefined" || !ROMANS.length) {
    $("loading").textContent = "⚠️ Registre des romans introuvable (romans.js).";
  } else {
    if (!ROMANS.some(function (r) { return r.id === startId; })) startId = ROMANS[0].id;
    switchRoman(startId);
  }

  // API pour tests (harnais) — ne pas utiliser ailleurs.
  window.__GLOSS = { renderAll: renderAll, computeStats: computeStats, VERSION: VERSION, dupRawCount: dupRawCount, loadOpen: loadOpen, isOpen: function (id) { return !!state.open[id]; }, openCount: function () { return Object.keys(state.open).length; }, storeGet: function (k) { return lsGet(k); } };
})();
</script>
</body>
</html>
